[project]
name = "alarm-investigation-copilot"
version = "0.1.0"
description = "Alarm investigation agent using LangGraph, MCP, Streamlit, and local RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "mcp>=1.30,<2",
    "langgraph>=0.6,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "langchain-community>=0.3,<1",
    "langchain-text-splitters>=0.3,<1",
    "faiss-cpu>=1.8,<2",
    "streamlit>=1.45,<2",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
